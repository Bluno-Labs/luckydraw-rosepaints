<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Draw Entry</title>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- SCROLL BUTTON -->
  <button id="scrollBtn">↓</button>

  <div class="app">

    <!-- HERO IMAGE -->
    <section class="hero-image">
      <img src="./assets/final.png" alt="Rose Paints Lucky Draw Campaign" />
    </section>

    <!-- CTA -->
    <section class="cta">
      <h2>Join Now & Win Big 🎉</h2>
      <p>Use your valid code to participate.<br> Each code can be used only once.</p>
    </section>

    <!-- FORM SECTION -->
    <section class="form-section">

      <h2>Enter Your Details</h2>

      <form id="entryForm" novalidate>

        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone *</label>
          <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" inputmode="numeric" autocomplete="tel" required />
        </div>

        <div class="form-group">
          <label for="code">Code *</label>
          <input type="text" id="code" name="code" placeholder="Enter 7-digit code" inputmode="numeric" maxlength="7" required />
        </div>

        <div class="form-group">
          <label for="address">Address *</label>
          <input type="text" id="address" name="address" placeholder="Enter your address" autocomplete="street-address" required />
        </div>

        <div class="form-group">
          <label for="dealer_name">Dealer Name *</label>
          <input type="text" id="dealer_name" name="dealer_name" placeholder="Enter dealer name" required />
        </div>

        <!-- MESSAGE -->
        <div id="message"></div>

        <button type="submit" id="submitBtn">
          Submit Entry
        </button>

      </form>

      <!-- ✅ SUCCESS UI (outside form) -->
      <div id="successBox" class="success-box hidden">
        <h3>🎉 Entry Confirmed!</h3>
        <p>Thank you for participating.</p>
        <p class="small">Winners will be announced soon.</p>
      </div>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/formHandler.js"></script>

</body>
</html>
