<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Draw Entry</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

  <!-- SCROLL BUTTON -->
  <button id="scrollBtn">↓</button>

  <div class="app">

    <!-- HERO IMAGE -->
    <section class="hero-image">
      <img src="./assets/final.png" alt="Rose Paints Lucky Draw Campaign" />
    </section>

    <!-- CTA -->
    <section class="cta">
      <h2>Join Now & Win Big 🎉</h2>
      <p>Use your valid coupon code to participate.<br>Each code can be used only once.</p>
    </section>

    <!-- FORM SECTION -->
    <section class="form-section">

      <h2>Enter Your Details</h2>

      <form id="entryForm" novalidate>

        <!-- 👤 PERSONAL INFO -->
        <div class="form-group">
          <label for="full_name">Full Name *</label>
          <input type="text" id="full_name" name="full_name" placeholder="e.g. Rajesh Hamal" required />
        </div>

        <div class="form-group">
          <label for="phone">Mobile Number *</label>
          <input type="tel" id="phone" name="phone" placeholder="98XXXXXXXX" inputmode="numeric" required />
        </div>

        <!-- 🎟️ COUPON -->
        <div class="form-group">
          <label for="code">Coupon Code *</label>
          <input type="text" id="code" name="code" placeholder="Enter 7-digit code" inputmode="numeric" maxlength="7" required />
        </div>

        <!-- 📍 ADDRESS -->
        <div class="form-group">
          <label for="province">Province *</label>
          <input type="text" id="province" name="province" placeholder="e.g. Gandaki" required />
        </div>

        <div class="form-group">
          <label for="district">District *</label>
          <input type="text" id="district" name="district" placeholder="e.g. Kaski" required />
        </div>

        <div class="form-group">
          <label for="municipality">Municipality / City *</label>
          <input type="text" id="municipality" name="municipality" placeholder="e.g. Pokhara Metropolitan City" required />
        </div>

        <div class="form-group">
          <label for="ward">Ward No. *</label>
          <input type="text" id="ward" name="ward" placeholder="e.g. 12" inputmode="numeric" required />
        </div>

        <div class="form-group">
          <label for="local_area">Local Area *</label>
          <input type="text" id="local_area" name="local_area" placeholder="e.g. Lakeside" required />
        </div>

        <!-- 🧾 PURCHASE DETAILS -->
        <div class="form-group">
          <label for="dealer_name">Dealer Name *</label>
          <input type="text" id="dealer_name" name="dealer_name" placeholder="Dealer / Shop name" required />
        </div>

        <div class="form-group">
          <label for="bill_name">Bill Name *</label>
          <input type="text" id="bill_name" name="bill_name" placeholder="Name on invoice" required />
        </div>

        <div class="form-group">
          <label for="invoice_number">Invoice Number *</label>
          <input type="text" id="invoice_number" name="invoice_number" placeholder="Enter invoice number" required />
        </div>

        <div class="form-group">
          <label for="invoice_date">Invoice Date (BS) *</label>
          <input 
            type="text"
            id="invoice_date"
            name="invoice_date"
            placeholder="YYYY-MM-DD (e.g. 2081-05-26)"
            pattern="^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
            inputmode="numeric"
            maxlength="10"
            required
          />
        </div>

        <div class="form-group">
          <label for="purchase_amount">Purchase Amount (NPR) *</label>
          <input type="number" id="purchase_amount" name="purchase_amount" placeholder="e.g. 25000" min="1" required />
        </div>

        <!-- MESSAGE -->
        <div id="message"></div>

        <!-- SUBMIT -->
        <button type="submit" id="submitBtn">
          Submit Entry
        </button>

      </form>

      <!-- SUCCESS UI -->
      <div id="successBox" class="success-box hidden">
        <h3>🎉 Entry Confirmed!</h3>
        <p>Thank you for participating.</p>
        <p class="small">Winners will be announced soon.</p>
      </div>

    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="./js/formHandler.js"></script>

</body>
</html>
